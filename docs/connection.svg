<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Схема зв'язку робот, контролер TM241 і джерело Cebora</title>
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Робот -->
  <rect x="20" y="170" width="200" height="110" rx="6" fill="#f2f6fb" stroke="#222" stroke-width="1.5"/>
  <text x="120" y="203" text-anchor="middle" font-weight="bold">Робот AIR10</text>
  <text x="120" y="228" text-anchor="middle">контролер INCUBE 10</text>
  <text x="120" y="250" text-anchor="middle">порт X23, User RS232</text>

  <!-- Контролер -->
  <rect x="390" y="150" width="190" height="150" rx="6" fill="#f2f6fb" stroke="#222" stroke-width="1.5"/>
  <text x="485" y="183" text-anchor="middle" font-weight="bold">Контролер Schneider</text>
  <text x="485" y="206" text-anchor="middle">Modicon TM241CEC24T</text>
  <text x="485" y="236" text-anchor="middle">Serial Line 1 (RJ45)</text>
  <text x="485" y="258" text-anchor="middle">CAN_1 (CANopen, майстер)</text>
  <text x="485" y="280" text-anchor="middle">вхід IX0.0</text>

  <!-- Cebora -->
  <rect x="750" y="170" width="190" height="110" rx="6" fill="#f2f6fb" stroke="#222" stroke-width="1.5"/>
  <text x="845" y="203" text-anchor="middle" font-weight="bold">Джерело Cebora</text>
  <text x="845" y="228" text-anchor="middle">функція Robot (rob On)</text>
  <text x="845" y="250" text-anchor="middle">CN2 (CAN bus-2), слейв</text>

  <!-- ЛПЗР -->
  <rect x="370" y="20" width="230" height="64" rx="6" fill="#fbf7ee" stroke="#222" stroke-width="1.5"/>
  <text x="485" y="46" text-anchor="middle" font-weight="bold">ПЛК комплексу ЛПЗР</text>
  <text x="485" y="68" text-anchor="middle">керує тим самим джерелом</text>

  <!-- лінки -->
  <line x1="220" y1="225" x2="390" y2="225" stroke="#222" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="580" y1="225" x2="750" y2="225" stroke="#222" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="485" y1="84" x2="485" y2="150" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="495" y="124" font-size="13">IX0.0 = 1: керує ЛПЗР</text>

  <text x="305" y="160" text-anchor="middle" font-size="13">RS232</text>
  <text x="305" y="177" text-anchor="middle" font-size="13">19200 бод, 8N1</text>
  <text x="305" y="194" text-anchor="middle" font-size="13">кадри 70 і 50 байт</text>

  <text x="665" y="160" text-anchor="middle" font-size="13">CANopen</text>
  <text x="665" y="177" text-anchor="middle" font-size="13">125 кбіт/с</text>
  <text x="665" y="194" text-anchor="middle" font-size="13">PDO: команди і стан</text>

  <!-- розпайка RS232 -->
  <rect x="30" y="335" width="400" height="115" rx="6" fill="#ffffff" stroke="#888" stroke-width="1"/>
  <text x="230" y="360" text-anchor="middle" font-weight="bold">Кабель RS232</text>
  <text x="50" y="386" font-size="13">RJ45 контролера (SL1)</text>
  <text x="290" y="386" font-size="13">M12 робота (X23)</text>
  <text x="50" y="408" font-size="13">1  RX</text>
  <text x="290" y="408" font-size="13">контакт 4</text>
  <text x="50" y="428" font-size="13">2  TX</text>
  <text x="290" y="428" font-size="13">контакт 1</text>
  <text x="50" y="446" font-size="13">8  GND</text>
  <text x="290" y="446" font-size="13">контакт 3</text>
  <line x1="150" y1="404" x2="280" y2="404" stroke="#888"/>
  <line x1="150" y1="424" x2="280" y2="424" stroke="#888"/>
  <line x1="150" y1="442" x2="280" y2="442" stroke="#888"/>

  <!-- розпайка CAN -->
  <rect x="500" y="335" width="430" height="115" rx="6" fill="#ffffff" stroke="#888" stroke-width="1"/>
  <text x="715" y="360" text-anchor="middle" font-weight="bold">Кабель CAN</text>
  <text x="520" y="386" font-size="13">клемник контролера</text>
  <text x="760" y="386" font-size="13">CN2 джерела</text>
  <text x="520" y="408" font-size="13">2  CAN_H</text>
  <text x="760" y="408" font-size="13">1  CAN2H</text>
  <text x="520" y="428" font-size="13">4  CAN_L</text>
  <text x="760" y="428" font-size="13">2  CAN2L</text>
  <text x="520" y="446" font-size="13">3  екран, 5  GND</text>
  <text x="760" y="446" font-size="13">3  Shield, 5  CAN2Gnd</text>
  <line x1="660" y1="404" x2="750" y2="404" stroke="#888"/>
  <line x1="660" y1="424" x2="750" y2="424" stroke="#888"/>
  <line x1="660" y1="442" x2="750" y2="442" stroke="#888"/>
</svg>
